# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit settings. Reference: https://docs.coderabbit.ai/reference/configuration
language: en-GB
tone_instructions: >-
  Be concise and technical. Lead with the concrete input or flag combination
  that fails. Cite the RFC or IANA registry section when questioning
  protocol behaviour.

reviews:
  # Assertive since PR #85; kept after the #86-#90 trial (docs/PLAN.md #61).
  profile: assertive
  review_details: true
  in_progress_fortune: false
  poem: false
  suggested_reviewers: false
  enable_prompt_for_ai_agents: true
  path_filters:
    - "!crates/testls-data/src/generated.rs"
    - "!**/Cargo.lock"
  path_instructions:
    - path: "crates/**/*.rs"
      instructions: >-
        Check the architecture: logic belongs in its crate (wire = codec,
        probe = network, checks = findings, report = output, testls = CLI).
        Flag new dependencies, and changes to Transport, Finding or the JSON
        schema without a matching docs/PLAN.md decision-log entry. Skip style
        points that clippy pedantic already enforces.
    - path: "crates/testls-wire/**/*.rs"
      instructions: >-
        Parses untrusted network input. Flag any panic path (indexing,
        slicing, unwrap, arithmetic overflow) reachable from peer bytes.
    - path: "crates/testls-*/**/*.rs"
      instructions: >-
        New protocol data tables and checks must cite their source (RFC or
        IANA registry section) in a comment. testls is a clean-room
        project: flag anything that looks copied from testssl.sh.
    - path: "crates/testls-probe/**/*.rs"
      instructions: >-
        Servers and proxies are untrusted. Flag unbounded reads or
        allocations, missing timeouts, and mishandled IPv6 or dual-stack
        addresses, including --proxy and --source-ip combinations.
    - path: "crates/testls-checks/**/*.rs"
      instructions: >-
        Look for false positives and false negatives, and check that the
        severity matches the cited source.
    - path: "crates/testls-scan/**/*.rs"
      instructions: >-
        The CLI and the web server share this pipeline. Check that every
        section emits its event once, in report order, that a failed
        section degrades to an error result instead of aborting the scan,
        and that no output formatting or exit-code logic leaks in.
    - path: "crates/testls-server/**/*.rs"
      instructions: >-
        The service is reachable from browsers. Check that every route goes
        through the auth guard, that targets cannot reach private addresses
        unless allowed (including through DNS answers), that limits on
        concurrency, rate, history and scan time hold, and that scanned text
        is never served as HTML or script.
    - path: "crates/testls/src/**/*.rs"
      instructions: >-
        Exit codes are a CLI contract: 0 = no findings at or above
        --fail-on, 1 = findings at or above it, 2 = scan error. Check flag
        combinations (multiple targets, CIDR ranges, --all-addresses,
        --resolve, --proxy, --source-ip, every --format) and that reports
        go to stdout and diagnostics to stderr.
    - path: "crates/testls-report/**/*.rs"
      instructions: >-
        JSON output must match docs/json-schema.md; flag fields that are
        added, renamed or removed without a matching schema change. All
        scanned text is untrusted: check escaping and injection for every
        format, deterministic ordering, and output for empty runs and
        failed scans.
    - path: "crates/testls/tests/**/*.rs"
      instructions: >-
        Tests that need the local servers must carry
        #[ignore = "needs tests/servers running"].
  auto_review:
    enabled: true
    drafts: false
    auto_pause_after_reviewed_commits: 0
  auto_approvals:
    enabled: true
    max_merge_risk: low
  pre_merge_checks:
    docstrings:
      mode: warning
      threshold: 80
    title:
      mode: warning
      requirements: >-
        Short imperative subject, optionally prefixed with the area, like
        "checks: add severity model" or "cli: report findings".
    custom_checks:
      - name: Changelog entry
        mode: warning
        instructions: >-
          Pass if the PR changes no user-visible behaviour (CLI flags,
          output, findings, exit codes) or if CHANGELOG.md gains an entry
          under "Unreleased". Fail otherwise.
      - name: JSON schema in sync
        mode: warning
        instructions: >-
          Pass if the PR does not change JSON output fields in
          crates/testls-report, or if docs/json-schema.md is updated to
          match. Fail otherwise.
  tools:
    clippy:
      enabled: true
    markdownlint:
      enabled: true
    actionlint:
      enabled: true
    shellcheck:
      enabled: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CONTRIBUTING.md"
      - "docs/agent-workflow.md"
  learnings:
    scope: local
