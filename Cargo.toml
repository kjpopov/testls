[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kjpopov/testls"
authors = ["Krasimir Popov"]

[workspace.dependencies]
# Internal crates carry an exact version so they stay publishable; bump these
# together with `workspace.package.version`.
testls-wire = { version = "=0.5.0", path = "crates/testls-wire" }
testls-data = { version = "=0.5.0", path = "crates/testls-data" }
testls-probe = { version = "=0.5.0", path = "crates/testls-probe" }
testls-checks = { version = "=0.5.0", path = "crates/testls-checks" }
testls-report = { version = "=0.5.0", path = "crates/testls-report" }
testls-scan = { version = "=0.5.0", path = "crates/testls-scan" }
testls-server = { version = "=0.5.0", path = "crates/testls-server" }
anstyle-query = "1.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
clap_mangen = "0.3"
futures-util = { version = "0.3", default-features = false }
getrandom = "0.4"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1.12"
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47", default-features = false }
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
webpki-roots = "1"
x509-parser = { version = "0.18", features = ["verify"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
