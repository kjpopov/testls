name: Fuzz

on:
  push:
    branches: [main, develop]
    paths:
      # The root manifest supplies testls-wire's version, edition and lints.
      - Cargo.toml
      - crates/testls-wire/**
      - fuzz/**
      - .github/workflows/fuzz.yml
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [record_stream, server_hello, certificate_list, server_key_exchange, ssl2_server_hello]
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ matrix.target }}
      # One minute per target on pushes and PRs, ten on the weekly run.
      SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && '600' || '60' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for relevant changes
        id: changes
        # Pull requests always run this job so it can be a required check, but
        # skip fuzzing unless they touch the root manifest (testls-wire's
        # version, edition and lints), testls-wire, fuzz/ or this workflow.
        # Pushes and scheduled runs always fuzz.
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ] || ! git diff --quiet "origin/$BASE_REF...HEAD" -- Cargo.toml crates/testls-wire/ fuzz/ .github/workflows/fuzz.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - if: steps.changes.outputs.run == 'true'
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-fuzz@0.13.2
      - if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      - name: Fuzz
        if: steps.changes.outputs.run == 'true'
        working-directory: fuzz
        # The prebuilt cargo-fuzz is a musl binary and would default to the
        # musl target, which AddressSanitizer does not support.
        run: |
          host="$(rustc +nightly -vV | sed -n 's/^host: //p')"
          cargo +nightly fuzz run --target "$host" "$TARGET" -- -max_total_time="$SECONDS_PER_TARGET"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
