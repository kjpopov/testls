# Local TLS servers for the integration tests in crates/testls/tests/servers.rs.
#
#   podman compose -f tests/servers/compose.yaml up -d --build
#   cargo test -p testls --test servers -- --ignored
#   podman compose -f tests/servers/compose.yaml down
#
# `docker compose` works the same way.
services:
  # TLS 1.0-1.2, every cipher OpenSSL still has, client cipher order.
  legacy:
    build: .
    image: localhost/testls-server
    command: ["-cipher", "ALL:@SECLEVEL=0", "-min_protocol", "TLSv1", "-max_protocol", "TLSv1.2"]
    ports: ["127.0.0.1:14433:4433"]

  # TLS 1.2-1.3, ECDHE with AEAD only, server cipher order.
  modern:
    build: .
    image: localhost/testls-server
    command: ["-serverpref", "-min_protocol", "TLSv1.2", "-cipher", "ECDHE+AESGCM:ECDHE+CHACHA20", "-alpn", "http/1.1"]
    ports: ["127.0.0.1:14434:4433"]

  # Postfix with optional STARTTLS on SMTP, TLS 1.2+.
  smtp:
    build:
      context: .
      dockerfile: Dockerfile.postfix
    image: localhost/testls-postfix
    ports: ["127.0.0.1:14425:25"]

  # Dovecot with STARTTLS on IMAP and POP3, TLS 1.2+.
  mail:
    build:
      context: .
      dockerfile: Dockerfile.dovecot
    image: localhost/testls-dovecot
    ports: ["127.0.0.1:14143:143", "127.0.0.1:14110:110"]

  # vsftpd with AUTH TLS on FTP, TLS 1.2+.
  ftp:
    build:
      context: .
      dockerfile: Dockerfile.vsftpd
    image: localhost/testls-vsftpd
    # As PID 1 under Docker, vsftpd segfaults after about ten sessions; an
    # init process in front of it avoids that.
    init: true
    ports: ["127.0.0.1:14021:21"]

  # Prosody with required STARTTLS on XMPP client connections, TLS 1.2+.
  xmpp:
    build:
      context: .
      dockerfile: Dockerfile.prosody
    image: localhost/testls-prosody
    ports: ["127.0.0.1:15222:5222"]

  # OpenLDAP with the StartTLS extended operation, TLS 1.2+.
  ldap:
    build:
      context: .
      dockerfile: Dockerfile.slapd
    image: localhost/testls-slapd
    ports: ["127.0.0.1:14389:389"]

  # PostgreSQL with SSLRequest, TLS 1.2+.
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: localhost/testls-postgres
    ports: ["127.0.0.1:15432:5432"]

  # MariaDB with SSLRequest, TLS 1.2+.
  mysql:
    build:
      context: .
      dockerfile: Dockerfile.mariadb
    image: localhost/testls-mariadb
    ports: ["127.0.0.1:13306:3306"]

  # OpenSSL before/after the Heartbleed fix, accessible only on loopback.
  heartbleed:
    build:
      context: .
      dockerfile: Dockerfile.heartbleed
    ports: ["127.0.0.1:14435:4433"]

  heartbleed-patched:
    build:
      context: .
      dockerfile: Dockerfile.heartbleed
      args:
        OPENSSL_RELEASE: OpenSSL_1_0_1g
        OPENSSL_SHA256: 3eb596dbd060859f6ff9e13c29ca4e902dd582be872be3bd8034edbdc44653d0
    ports: ["127.0.0.1:14436:4433"]

  # OpenSSL 1.0.1h fixes CVE-2014-0224; 1.0.1g above is affected.
  ccs-patched:
    build:
      context: .
      dockerfile: Dockerfile.heartbleed
      args:
        OPENSSL_RELEASE: OpenSSL_1_0_1h
        OPENSSL_SHA256: 4844f4631e5731db188293b2b7d61ecf79d57c3cb7bdb8abf9ab2fbd0a65da23
    ports: ["127.0.0.1:14437:4433"]
