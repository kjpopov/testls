[package]
name = "testls"
description = "TLS/SSL scanner for the web era, inspired by testssl.sh."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["tls", "ssl", "scanner", "security", "cli"]
categories = ["command-line-utilities", "network-programming", "cryptography"]

# `cargo binstall testls` downloads the archives built by release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
anstyle-query.workspace = true
clap = { workspace = true }
clap_complete.workspace = true
clap_mangen.workspace = true
serde.workspace = true
serde_json.workspace = true
testls-checks.workspace = true
testls-probe.workspace = true
testls-report.workspace = true
testls-scan.workspace = true
testls-server.workspace = true
testls-wire.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "signal"] }
toml.workspace = true

[dev-dependencies]
rustls.workspace = true

[lints]
workspace = true
